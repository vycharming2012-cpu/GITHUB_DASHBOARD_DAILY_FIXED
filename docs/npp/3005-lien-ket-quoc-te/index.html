function norm(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim()}function sameLevel(program,current){let p=norm(program),c=norm(current);if(p==='SACHET 1 3')return ['SACHET 1','SACHET 2','SACHET 3','SACHET 1 3'].includes(c);const aliases={'MS HC 100M':['100M HC','MS HC 100M'],'MS FCL 8M':['8M FABCLEAN','8M FCL','MS FCL 8M'],'DRUG L':['DRUG L','DRUG_L'],'SUPER FG':['SUPER FG','SUPER_FG'],'SKIN SET 1':['SKIN SET 1','BOPHUSKIN SET1','BOPHUSKIN SET 1'],'SKIN SET 2':['SKIN SET 2','BOPHUSKIN SET2','BOPHUSKIN SET 2'],'ORAL TP 144M':['ORAL TP 144M','MS ORAL 144M','MS_ORAL_144M'],'ORAL 35M':['ORAL 35M','ORAL_35M','KDR 35M','KDR_35M'],'ORAL 35M PREMIUM':['ORAL 35M PREMIUM','ORAL_35M_PREMIUM','35M PREMIUM','35M_PREMIUM','KDR 35M PREMIUM','KDR_35M_PREMIUM'],'35M PREMIUM':['35M PREMIUM','35M_PREMIUM','ORAL 35M PREMIUM','ORAL_35M_PREMIUM','KDR 35M PREMIUM','KDR_35M_PREMIUM'],'35M ORAL':['35M ORAL','35M_ORAL','ORAL 35M','ORAL_35M','KDR 35M','KDR_35M'],'MS H MEN 10M':['MS H MEN 10M','MS H.MEN 10M','MS_H.MEN_10M','MS MEN 10M','MEN 10M']};if(aliases[p]&&aliases[p].map(norm).includes(c))return true;return p===c}function already(o,program){return (CURRENT[o.c]||[]).some(x=>sameLevel(program,x))}function setLevel(x,prefix){let n=norm(x),m=n.match(new RegExp('^'+prefix+' SET (\\d+)$'));return m?Number(m[1]):0}function currentMaxSet(o,prefix){return Math.max(0,...(CURRENT[o.c]||[]).map(x=>setLevel(x,prefix)))}function currentNames(o){return (CURRENT[o.c]||[]).map(norm)}function hasCHHH(o){return currentNames(o).some(n=>/^(HC SET|BPC SET|FOOD SET|SUPER FG|DRUG L)/.test(n))}function hasSachet13(o){return currentNames(o).some(n=>['SACHET 1','SACHET 2','SACHET 3','SACHET 1 3'].includes(n))}function hasSachet46(o){return currentNames(o).some(n=>['SACHET 4','SACHET 6'].includes(n))}function hasSuperFG(o){return (CURRENT[o.c]||[]).some(x=>['SUPER FG','SUPERFG'].includes(norm(x)))}function groups(o){if(hasSuperFG(o))return [{name:'CHHH',items:[]}];let a=autoRows(o).filter(r=>!already(o,r.program)), result=[];
  let chhh=[];let hc=highest(a,r=>r.program.startsWith('HC Set')).filter(r=>setLevel(r.program,'HC')>currentMaxSet(o,'HC'));let bpc=highest(a,r=>r.program.startsWith('BPC Set')).filter(r=>setLevel(r.program,'BPC')>currentMaxSet(o,'BPC'));let food=highest(a,r=>r.program.startsWith('Food Set')).filter(r=>setLevel(r.program,'FOOD')>currentMaxSet(o,'FOOD'));chhh.push(...hc,...bpc,...food);
  if(norm(o.ch)==='DT H B' && o.t>110000000 && !already(o,'Drug_L'))chhh.push({group:'CHHH',program:'Drug_L',type:'TOTAL',min:110000000,reward:null,method:'AUTO',spec:'',actual:o.t});if(['F GROCERY','FAMILY GROCERY'].includes(norm(o.ch)) && o.t>100000000 && !already(o,'Super FG'))chhh.push({group:'CHHH',program:'Super FG',type:'TOTAL',min:100000000,reward:null,method:'AUTO',spec:'',actual:o.t});if(chhh.length)result.push({name:'CHHH',items:chhh});
  let sachet=[];let s13=a.filter(r=>/^SACHET_[123]$/.test(r.program));if(!hasCHHH(o)&&!hasSachet46(o)&&s13.length&&!already(o,'Sachet 1-3')){let x=s13.sort((x,y)=>(y.reward||0)-(x.reward||0))[0];sachet.push({...x,program:'Sachet 1-3'});}if(!hasSachet13(o))sachet.push(...a.filter(r=>['SACHET_4','SACHET_6'].includes(r.program)));if(sachet.length)result.push({name:'Sachet',items:sachet});
  let consumed=new Set([...chhh.map(r=>r.program),...s13.map(r=>r.program),...sachet.map(r=>r.program)]);let rem=a.filter(r=>!consumed.has(r.program)&&r.program!=='H&B L'&&!r.program.startsWith('HC Set')&&!r.program.startsWith('BPC Set')&&!r.program.startsWith('Food Set'));
  let by={};for(const r of rem)(by[r.group]??=[]).push(r);for(const name of Object.keys(by)){let rows=by[name].filter(r=>!/^HC Set/i.test(r.program)&&!/^BPC Set/i.test(r.program)&&!/^Food Set/i.test(r.program)),items=[];if(name==='BW'){items.push(...highest(rows,r=>/HAIR_(10|28|50|84)M/.test(r.program)));items.push(...rows.filter(r=>/HERBAL|MEN/.test(r.program)));}else if(name==='HC'){items=rows;}else if(name==='PC'){let siteCode=String(o.s||'').split('_')[0].toUpperCase();let isHiep=['3309','3257','3002','3005','3BJ1'].includes(siteCode);let oral144=highest(rows,r=>/ORAL_TP_144M/.test(r.program));let oral35=isHiep?highest(rows,r=>/KDR_35M_PREMIUM/.test(r.program)):highest(rows,r=>r.program==='KDR_35M');oral35=oral35.map(r=>({...r,program:isHiep?'35M_PREMIUM':'35M_ORAL'}));let brush48=highest(rows,r=>/^TBRUSH_48M-50M$/.test(r.program));let brush3=highest(rows,r=>/^T\.BRUSH_3V$/.test(r.program));let brush=brush48.length?brush48:brush3;items=[...oral35,...oral144,...brush,...rows.filter(r=>/PCISLAND|PC_41M/.test(r.program))];}else if(name==='SKIN'){items=highest(rows,r=>/^SKIN SET/i.test(r.program));}else items=rows;items=items.filter(r=>!already(o,r.program));if(items.length){let target=name==='SKIN'?'BW':(name==='ORAL'?'PC':name);let existing=result.find(x=>x.name===target);if(existing)existing.items.push(...items);else result.push({name:target,items});}}
  let merged=[];for(const g of result){let target=g.name==='ORAL'?'PC':g.name;let x=merged.find(z=>z.name===target);if(x)x.items.push(...g.items);else merged.push({name:target,items:g.items});}return merged;
}
function displayCurrent(x){let u=String(x).toUpperCase();if(['MEN 10M','MS MEN 10M','MS H.MEN 10M','MS_H.MEN_10M'].includes(u))return 'MS MEN 10M';if(['8M FCL','8M FABCLEAN','MS FCL 8M'].includes(u))return 'MS FCL 8M';if(['MS ORAL 144M','MS_ORAL_144M'].includes(u))return 'ORAL TP 144M';if(['KDR_35M','KDR 35M','ORAL 35M','ORAL_35M','35M_ORAL','35M ORAL'].includes(u))return '35M_ORAL';if(['KDR_35M_PREMIUM','KDR 35M PREMIUM','ORAL_35M_PREMIUM','ORAL 35M PREMIUM','35M_PREMIUM','35M PREMIUM'].includes(u))return '35M_PREMIUM';return x}function currentForGroup(o,g){let xs=CURRENT[o.c]||[];if(hasSuperFG(o))return g==='CHHH'?['Super FG']:[];return xs.filter(x=>{let n=norm(x);if(g==='CHHH')return /^(HC SET|BPC SET|FOOD SET|H B L)/.test(n);if(g==='Sachet')return /^SACHET (1|2|3|4|6)$/.test(n);let gn=norm(g);if(gn==='HC')return /(FCL|HC)/.test(n)&&!/^HC SET/.test(n);if(gn==='PC')return /(KDR|ORAL|TBRUSH|PC)/.test(n)&&!/^BPC SET/.test(n);if(gn==='BW')return /(HAIR|MEN|HERBAL|SKIN|BOPHUSKIN)/.test(n);return n.includes(gn)}).map(displayCurrent)}function itemHTML(r){return `<div class="item"><div><div class="pname">${esc(r.program.replaceAll('_',' '))}</div><div class="detail">Banker DS: ${String(r.type).toUpperCase()==='TOTAL'?'Total U':(String(r.type).toUpperCase()==='HC'?'Fabclean Liquid + Fabenc + HNH Dishwash':(String(r.type).toUpperCase()==='PC41'?'Toothpaste + SCL':(String(r.type).toUpperCase()==='PCISLAND'?'Total PC':esc(r.type))))} >= ${money(r.min)} · DS thực tế: ${money(r.actual)}</div></div><div class="reward">${r.program==='Sachet 1-3'?'Mức thưởng: 6-12 dây Clear':(r.program==='SACHET_4'?'Mức thưởng: 8 dây Clear':(r.program==='SACHET_6'?'Mức thưởng: 100.000 đ':(r.reward?'Mức thưởng: '+money(r.reward):'')))}</div></div>`}
function render(){let q=$('q').value.trim().toLowerCase(),site=$('site').value,cur=$('currentSet').value,prop=$('proposedSet').value;let rows=DATA.filter(o=>(!q||(o.n+' '+o.c).toLowerCase().includes(q))&&(!site||o.s===site)&&(!cur||(CURRENT[o.c]||[]).some(x=>norm(displayCurrent(x))===cur))&&(!prop||groups(o).some(g=>g.items.some(r=>norm(r.program)===prop)))).sort((a,b)=>b.t-a.t);$('count').textContent=fmt(rows.length)+' cửa hàng';$('list').innerHTML=rows.map(o=>{let gs=groups(o);return `<details class="store"><summary><div><div class="name">${esc(o.n)}</div><div class="sub">${esc(o.c)} · ${esc(o.ch)} · ${esc(o.s)}</div></div><div class="sales">${money(o.t)}</div><b>›</b></summary><div class="groups">${gs.length?gs.map(g=>`<section class="group"><div class="group-title ${g.name==='Sachet'?'sachet':''}">${esc(g.name)}</div><div class="compare"><div class="col"><div class="colh">ĐANG TRƯNG BÀY</div>${currentForGroup(o,g.name).length?currentForGroup(o,g.name).map(x=>`<div class="current-item">${esc(x.replaceAll('_',' '))}</div>`).join(''):'<div class="none">Chưa có</div>'}</div><div class="col"><div class="colh">ĐỀ NGHỊ</div>${g.items.length?g.items.map(itemHTML).join(''):'<div class="none">Không đề nghị thêm</div>'}</div></div></section>`).join(''):'<div class="empty">Chưa đạt ngưỡng trưng bày AUTO.</div>'}</div></details>`}).join('')}
function fillSetFilters(){let cur=[...new Set(Object.values(CURRENT).flat().map(displayCurrent).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'vi'));$('currentSet').innerHTML='<option value="">Tất cả set đang trưng bày</option>'+cur.map(v=>`<option value="${esc(norm(v))}">${esc(String(v).replaceAll('_',' '))}</option>`).join('');let pm=new Map();for(const o of DATA)for(const g of groups(o))for(const r of g.items)pm.set(norm(r.program),r.program.replaceAll('_',' '));$('proposedSet').innerHTML='<option value="">Tất cả set đề nghị</option>'+[...pm.entries()].sort((a,b)=>a[1].localeCompare(b[1],'vi')).map(([k,v])=>`<option value="${esc(k)}">${esc(v)}</option>`).join('')}
$('site').innerHTML += [...new Set(DATA.map(o=>o.s))].sort().map(v=>`<option>${esc(v)}</option>`).join('');fillSetFilters();$('q').addEventListener('input',render);$('site').addEventListener('change',render);$('currentSet').addEventListener('change',render);$('proposedSet').addEventListener('change',render);render();
</script></body></html>
