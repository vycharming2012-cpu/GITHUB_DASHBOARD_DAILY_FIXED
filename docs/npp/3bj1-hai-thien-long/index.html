function displayCurrent(x){let u=String(x).toUpperCase();if(['MEN 10M','MS MEN 10M','MS H.MEN 10M','MS_H.MEN_10M'].includes(u))return 'MS MEN 10M';if(['8M FCL','8M FABCLEAN','MS FCL 8M'].includes(u))return 'MS FCL 8M';if(['MS ORAL 144M','MS_ORAL_144M'].includes(u))return 'ORAL TP 144M';if(['KDR_35M','KDR 35M','ORAL 35M','ORAL_35M','35M_ORAL','35M ORAL'].includes(u))return '35M_ORAL';if(['KDR_35M_PREMIUM','KDR 35M PREMIUM','ORAL_35M_PREMIUM','ORAL 35M PREMIUM','35M_PREMIUM','35M PREMIUM'].includes(u))return '35M_PREMIUM';return x}function currentForGroup(o,g){let xs=CURRENT[o.c]||[];if(hasSuperFG(o))return g==='CHHH'?['Super FG']:[];return xs.filter(x=>{let n=norm(x);if(g==='CHHH')return /^(HC SET|BPC SET|FOOD SET|H B L)/.test(n);if(g==='Sachet')return /^SACHET (1|2|3|4|6)$/.test(n);let gn=norm(g);if(gn==='HC')return /(FCL|HC)/.test(n)&&!/^HC SET/.test(n);if(gn==='PC')return /(KDR|ORAL|TBRUSH|PC)/.test(n)&&!/^BPC SET/.test(n);if(gn==='BW')return /(HAIR|MEN|HERBAL|SKIN|BOPHUSKIN)/.test(n);return n.includes(gn)}).map(displayCurrent)}function itemHTML(r){return `<div class="item"><div><div class="pname">${esc(r.program.replaceAll('_',' '))}</div><div class="detail">Banker DS: ${String(r.type).toUpperCase()==='TOTAL'?'Total U':(String(r.type).toUpperCase()==='HC'?'Fabclean Liquid + Fabenc + HNH Dishwash':(String(r.type).toUpperCase()==='PC41'?'Toothpaste + SCL':(String(r.type).toUpperCase()==='PCISLAND'?'Total PC':esc(r.type))))} >= ${money(r.min)} · DS thực tế: ${money(r.actual)}</div></div><div class="reward">${r.program==='Sachet 1-3'?'Mức thưởng: 6-12 dây Clear':(r.program==='SACHET_4'?'Mức thưởng: 8 dây Clear':(r.program==='SACHET_6'?'Mức thưởng: 100.000 đ':(r.reward?'Mức thưởng: '+money(r.reward):'')))}</div></div>`}
function render(){let q=$('q').value.trim().toLowerCase(),site=$('site').value,cur=$('currentSet').value,prop=$('proposedSet').value;let rows=DATA.filter(o=>(!q||(o.n+' '+o.c).toLowerCase().includes(q))&&(!site||o.s===site)&&(!cur||(CURRENT[o.c]||[]).some(x=>norm(displayCurrent(x))===cur))&&(!prop||groups(o).some(g=>g.items.some(r=>norm(r.program)===prop)))).sort((a,b)=>b.t-a.t);$('count').textContent=fmt(rows.length)+' cửa hàng';$('list').innerHTML=rows.map(o=>{let gs=groups(o);return `<details class="store"><summary><div><div class="name">${esc(o.n)}</div><div class="sub">${esc(o.c)} · ${esc(o.ch)} · ${esc(o.s)}</div></div><div class="sales">${money(o.t)}</div><b>›</b></summary><div class="groups">${gs.length?gs.map(g=>`<section class="group"><div class="group-title ${g.name==='Sachet'?'sachet':''}">${esc(g.name)}</div><div class="compare"><div class="col"><div class="colh">ĐANG TRƯNG BÀY</div>${currentForGroup(o,g.name).length?currentForGroup(o,g.name).map(x=>`<div class="current-item">${esc(x.replaceAll('_',' '))}</div>`).join(''):'<div class="none">Chưa có</div>'}</div><div class="col"><div class="colh">ĐỀ NGHỊ</div>${g.items.length?g.items.map(itemHTML).join(''):'<div class="none">Không đề nghị thêm</div>'}</div></div></section>`).join(''):'<div class="empty">Chưa đạt ngưỡng trưng bày AUTO.</div>'}</div></details>`}).join('')}
function fillSetFilters(){let cur=[...new Set(Object.values(CURRENT).flat().map(displayCurrent).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'vi'));$('currentSet').innerHTML='<option value="">Tất cả set đang trưng bày</option>'+cur.map(v=>`<option value="${esc(norm(v))}">${esc(String(v).replaceAll('_',' '))}</option>`).join('');let pm=new Map();for(const o of DATA)for(const g of groups(o))for(const r of g.items)pm.set(norm(r.program),r.program.replaceAll('_',' '));$('proposedSet').innerHTML='<option value="">Tất cả set đề nghị</option>'+[...pm.entries()].sort((a,b)=>a[1].localeCompare(b[1],'vi')).map(([k,v])=>`<option value="${esc(k)}">${esc(v)}</option>`).join('')}
$('site').innerHTML += [...new Set(DATA.map(o=>o.s))].sort().map(v=>`<option>${esc(v)}</option>`).join('');fillSetFilters();$('q').addEventListener('input',render);$('site').addEventListener('change',render);$('currentSet').addEventListener('change',render);$('proposedSet').addEventListener('change',render);render();
</script></body></html>
