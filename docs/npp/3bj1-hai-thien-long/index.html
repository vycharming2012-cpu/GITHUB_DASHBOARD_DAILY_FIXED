return Math.max(0,...(CURRENT[o.c]||[]).map(x=>{let n=norm(displayCurrent(x));if(/^(SKIN|BOPHUSKIN|BOPHUKIN) SET ?2$/.test(n))return 2;if(/^(SKIN|BOPHUSKIN|BOPHUKIN) SET ?1$/.test(n))return 1;return 0}))}function currentHairLevel(o){let levels={'MS HAIR 10M':10,'MS HAIR 28M':28,'MS HAIR 50M':50,'MS HAIR 84M':84};return Math.max(0,...(CURRENT[o.c]||[]).map(x=>levels[norm(x)]||0))}function hasHC100(o){return (CURRENT[o.c]||[]).some(x=>['100M HC','MS HC 100M'].includes(norm(x)))}function hasSuperFG(o){return (CURRENT[o.c]||[]).some(x=>['SUPER FG','SUPERFG'].includes(norm(x)))}function groups(o){if(hasSuperFG(o))return [{name:'CHHH',items:[]}];let a=autoRows(o).filter(r=>!already(o,r.program)), result=[];
  let chhh=[];let hc=highest(a,r=>r.program.startsWith('HC Set')).filter(r=>setLevel(r.program,'HC')>currentMaxSet(o,'HC'));let bpc=highest(a,r=>r.program.startsWith('BPC Set')).filter(r=>setLevel(r.program,'BPC')>currentMaxSet(o,'BPC'));let food=highest(a,r=>r.program.startsWith('Food Set')).filter(r=>setLevel(r.program,'FOOD')>currentMaxSet(o,'FOOD'));chhh.push(...hc,...bpc,...food);
  if(norm(o.ch)==='DT H B' && o.t>110000000 && !already(o,'Drug_L'))chhh.push({group:'CHHH',program:'Drug_L',type:'TOTAL',min:110000000,reward:null,method:'AUTO',spec:'',actual:o.t});if(['F GROCERY','FAMILY GROCERY'].includes(norm(o.ch)) && o.t>100000000 && !already(o,'Super FG'))chhh.push({group:'CHHH',program:'Super FG',type:'TOTAL',min:100000000,reward:null,method:'AUTO',spec:'',actual:o.t});if(chhh.length)result.push({name:'CHHH',items:chhh});
  let currentFoodSet=(CURRENT[o.c]||[]).some(x=>/^FOOD SET [12]$/.test(norm(x)));let knorr=[];if(!currentFoodSet){knorr=a.filter(r=>['Knorr 24M','Knorr 12M'].includes(r.program)&&!already(o,r.program));}if(knorr.length)result.push({name:'Food',items:knorr});
  let sachet=[];let s13=a.filter(r=>/^SACHET_[123]$/.test(r.program));if(!hasCHHH(o)&&!hasSachet46(o)&&s13.length&&!already(o,'Sachet 1-3')){let x=s13.sort((x,y)=>(y.reward||0)-(x.reward||0))[0];sachet.push({...x,program:'Sachet 1-3'});}if(!hasSachet13(o))sachet.push(...a.filter(r=>['SACHET_4','SACHET_6'].includes(r.program)));if(sachet.length)result.push({name:'Sachet',items:sachet});
  let consumed=new Set([...chhh.map(r=>r.program),...knorr.map(r=>r.program),...s13.map(r=>r.program),...sachet.map(r=>r.program)]);let rem=a.filter(r=>!consumed.has(r.program)&&r.program!=='H&B L'&&!r.program.startsWith('HC Set')&&!r.program.startsWith('BPC Set')&&!r.program.startsWith('Food Set')&&!['Knorr 24M','Knorr 12M'].includes(r.program));
  let by={};for(const r of rem)(by[r.group]??=[]).push(r);for(const name of Object.keys(by)){let rows=by[name].filter(r=>!/^HC Set/i.test(r.program)&&!/^BPC Set/i.test(r.program)&&!/^Food Set/i.test(r.program)),items=[];if(name==='BW'){let hair=highest(rows,r=>/HAIR_(10|28|50|84)M/.test(r.program)).filter(r=>{let m=norm(r.program).match(/HAIR (10|28|50|84)M/);return m&&Number(m[1])>currentHairLevel(o)});items.push(...hair);items.push(...rows.filter(r=>/HERBAL|MEN/.test(r.program)));}else if(name==='HC'){items=rows.filter(r=>!(hasHC100(o)&&/FCL_8M|FCL 8M/.test(r.program)));}else if(name==='PC'){let siteCode=String(o.s||'').split('_')[0].toUpperCase();let isHiep=['3309','3257','3002','3005','3BJ1'].includes(siteCode);let oral144=highest(rows,r=>/ORAL_TP_144M/.test(r.program));let oral35=isHiep?highest(rows,r=>/KDR_35M_PREMIUM/.test(r.program)):highest(rows,r=>r.program==='KDR_35M');oral35=oral35.map(r=>({...r,program:isHiep?'35M_PREMIUM':'35M_ORAL'}));let brush48=highest(rows,r=>/^TBRUSH_48M-50M$/.test(r.program));let brush3=highest(rows,r=>/^T\.BRUSH_3V$/.test(r.program));let brush=brush48.length?brush48:brush3;items=[...oral35,...oral144,...brush,...rows.filter(r=>/PCISLAND|PC_41M/.test(r.program))];}else if(name==='SKIN'){items=highest(rows,r=>/^SKIN SET/i.test(r.program)).filter(r=>{let m=norm(r.program).match(/^SKIN SET (1|2)$/);return m&&Number(m[1])>currentSkinLevel(o)});}else items=rows;items=items.filter(r=>!already(o,r.program));if(items.length){let target=name==='SKIN'?'BW':(name==='ORAL'?'PC':name);let existing=result.find(x=>x.name===target);if(existing)existing.items.push(...items);else result.push({name:target,items});}}
  let merged=[];for(const g of result){let target=g.name==='ORAL'?'PC':g.name;let x=merged.find(z=>z.name===target);if(x)x.items.push(...g.items);else merged.push({name:target,items:g.items});}
  // Final safety gate: never recommend a lower SKIN level than current display.
  let skinNow=currentSkinLevel(o);for(const g of merged){if(g.name==='BW')g.items=g.items.filter(r=>{let m=norm(r.program).match(/^SKIN SET ?(1|2)$/);return !m||Number(m[1])>skinNow;});}
  // Keep current-display panels visible even when there is no further recommendation.
  for(const name of ['CHHH','Sachet','Food','HC','PC','BW']){if(currentForGroup(o,name).length&&!merged.some(g=>g.name===name))merged.push({name,items:[]});}
  return merged;
}
function displayCurrent(x){let u=String(x).toUpperCase();if(['BOPHUKIN SET1','BOPHUKIN SET 1','BOPHUSKIN SET1','BOPHUSKIN SET 1'].includes(u))return 'SKIN SET 1';if(['BOPHUKIN SET2','BOPHUKIN SET 2','BOPHUSKIN SET2','BOPHUSKIN SET 2'].includes(u))return 'SKIN SET 2';if(['HERBAL 10M','MS HERBAL 10M','MS H.HERBAL 10M','MS_H.HERBAL_10M','BW_HERBAL_10M'].includes(u))return 'MS H.HERBAL 10M';if(['KNORR_24M','24M KNORR','KNORR 24M'].includes(u))return 'Knorr 24M';if(['KNORR_12MAT','12M KNORR','KNORR 12M'].includes(u))return 'Knorr 12M';if(['MEN 10M','MS MEN 10M','MS H.MEN 10M','MS_H.MEN_10M'].includes(u))return 'MS MEN 10M';if(['8M FCL','8M FABCLEAN','MS FCL 8M'].includes(u))return 'MS FCL 8M';if(['MS ORAL 144M','MS_ORAL_144M'].includes(u))return 'ORAL TP 144M';if(['KDR_35M','KDR 35M','ORAL 35M','ORAL_35M','35M_ORAL','35M ORAL'].includes(u))return '35M_ORAL';if(['KDR_35M_PREMIUM','KDR 35M PREMIUM','ORAL_35M_PREMIUM','ORAL 35M PREMIUM','35M_PREMIUM','35M PREMIUM'].includes(u))return '35M_PREMIUM';return x}function headerCurrent(o){let xs=CURRENT[o.c]||[];if(hasSuperFG(o))return 'Super FG';let labels=[...new Set(xs.map(displayCurrent).filter(Boolean))];return labels.length?labels.join(', '):''}
function currentForGroup(o,g){let xs=CURRENT[o.c]||[];if(hasSuperFG(o))return g==='CHHH'?['Super FG']:[];return xs.filter(x=>{let n=norm(x);if(g==='CHHH')return /^(HC SET|BPC SET|FOOD SET|H B L)/.test(n);if(g==='Sachet')return /^SACHET (1|2|3|4|6)$/.test(n);if(g==='Food')return /KNORR/.test(n);let gn=norm(g);if(gn==='HC')return /(FCL|HC)/.test(n)&&!/^HC SET/.test(n);if(gn==='PC')return /(KDR|ORAL|TBRUSH|PC)/.test(n)&&!/^BPC SET/.test(n);if(gn==='BW')return /(HAIR|MEN|HERBAL|SKIN|BOPHUSKIN)/.test(n);return n.includes(gn)}).map(displayCurrent)}function itemHTML(r){return `<div class="item"><div><div class="pname">${esc(r.program.replaceAll('_',' '))}</div><div class="detail">Banker DS: ${String(r.type).toUpperCase()==='TOTAL'?'Total U':(String(r.type).toUpperCase()==='HC'?'Fabclean Liquid + Fabenc + HNH Dishwash':(String(r.type).toUpperCase()==='PC41'?'Toothpaste + SCL':(String(r.type).toUpperCase()==='PCISLAND'?'Total PC':esc(r.type))))} >= ${money(r.min)} · DS thực tế: ${money(r.actual)}</div></div><div class="reward">${r.program==='Sachet 1-3'?'Mức thưởng: 6-12 dây Clear':(r.program==='SACHET_4'?'Mức thưởng: 8 dây Clear':(r.program==='SACHET_6'?'Mức thưởng: 100.000 đ':(r.reward?'Mức thưởng: '+money(r.reward):'')))}</div></div>`}

function storeColorClass(o){
  let xs=(CURRENT[o.c]||[]).map(x=>norm(displayCurrent(x))).filter(Boolean);
  if(xs.some(x=>x==='SUPER FG'||x==='SUPERFG'))return 'status-green';
  let hasHC=xs.some(x=>/^HC SET(?: |$)/.test(x));
  let hasBPC=xs.some(x=>/^BPC SET(?: |$)/.test(x));
  let hasFood=xs.some(x=>/^FOOD SET(?: |$)/.test(x));
  if(hasHC&&hasBPC&&hasFood)return 'status-green';
  if(xs.length===0 && norm(o.ch)!=='SEMI RETAIL')return 'status-red';
  return '';
}
function render(){let q=$('q').value.trim().toLowerCase(),site=$('site').value,cur=$('currentSet').value,prop=$('proposedSet').value;let rows=DATA.filter(o=>(!q||(o.n+' '+o.c).toLowerCase().includes(q))&&(!site||o.s===site)&&(!cur||(CURRENT[o.c]||[]).some(x=>norm(displayCurrent(x))===cur))&&(!prop||groups(o).some(g=>g.items.some(r=>norm(r.program)===prop)))).sort((a,b)=>b.t-a.t);$('count').textContent=fmt(rows.length)+' cửa hàng';$('list').innerHTML=rows.map(o=>{let gs=groups(o);return `<details class="store ${storeColorClass(o)}"><summary><div><div class="name">${esc(o.n)}</div><div class="sub">${esc(o.c)} · ${esc(o.ch)} · ${esc(o.s)}${headerCurrent(o)?` · <b>Đang TB:</b> ${esc(headerCurrent(o))}`:''}</div></div><div class="sales">${money(o.t)}</div><b>›</b></summary><div class="groups">${gs.length?gs.map(g=>`<section class="group"><div class="group-title ${g.name==='Sachet'?'sachet':''}">${esc(g.name)}</div><div class="compare"><div class="col"><div class="colh">ĐANG TRƯNG BÀY</div>${currentForGroup(o,g.name).length?currentForGroup(o,g.name).map(x=>`<div class="current-item">${esc(x.replaceAll('_',' '))}</div>`).join(''):'<div class="none">Chưa có</div>'}</div><div class="col"><div class="colh">ĐỀ NGHỊ</div>${g.items.length?g.items.map(itemHTML).join(''):'<div class="none">Không đề nghị thêm</div>'}</div></div></section>`).join(''):'<div class="empty">Chưa đạt ngưỡng trưng bày AUTO.</div>'}</div></details>`}).join('')}

function mergeSetLabel(x){let n=norm(String(x).replaceAll('_',' '));if(['SACHET 1','SACHET 2','SACHET 3','SACHET 1 3'].includes(n))return 'Sachet 1-3';if(['HC 100M','100M HC','MS HC 100M'].includes(n))return 'HC 100M';if(['BOPHUSKIN SET 1','BOPHUSKIN SET1','BOPHUKIN SET 1','BOPHUKIN SET1','SKIN SET 1','SKIN 1'].includes(n))return 'Skin 1';if(['BOPHUSKIN SET 2','BOPHUSKIN SET2','BOPHUKIN SET 2','BOPHUKIN SET2','SKIN SET 2','SKIN 2'].includes(n))return 'Skin 2';if(['35M ORAL','35M ORAL'].includes(n))return '35M Oral';if(['35M PREMIUM','35M PREMIUM'].includes(n))return '35M Premium';if(['T BRUSH 3V','TBRUSH 3V','T BRUSH3V','TBRUSH3V'].includes(n))return 'T.Brush 3V';if(['8M FCL','MS FCL 8M','8M FABCLEAN'].includes(n))return '8M FCL';if(['HC BUILDING','BUILDING HC'].includes(n))return 'HC Building';if(['FOOD BUILDING','BUILDING FOOD'].includes(n))return 'Food Building';if(['HC BUILDING 1','HC BUILDING1'].includes(n))return 'HC Building 1';if(['HC BUILDING 2','HC BUILDING2'].includes(n))return 'HC Building 2';if(['BPC BUILDING','BUILDING BPC'].includes(n))return 'BPC Building';if(['TBRUSH 48 50M','T BRUSH 48 50M','TBRUSH 48-50M','T BRUSH 48-50M'].includes(n))return 'Tbrush 48-50M';if(['PC 41M','41M PC'].includes(n))return 'PC 41M';if(['PC ISLAND','ISLAND PC'].includes(n))return 'PC Island';if(['ORAL 144M','ORAL TP 144M','MS ORAL 144M'].includes(n))return 'Oral 144M';if(['HAIR 10M'].includes(n))return 'Hair 10M';if(['MEN 10M','MS MEN 10M','MS H.MEN 10M'].includes(n))return 'Men 10M';if(['HERBAL 10M','MS H.HERBAL 10M','MS HERBAL 10M'].includes(n))return 'Herbal 10M';if(['HAIR 28M'].includes(n))return 'Hair 28M';if(['50M'].includes(n))return '50M';if(['84M'].includes(n))return '84M';return String(x).replaceAll('_',' ')}function summarySetName(x){return mergeSetLabel(displayCurrent(x)||x)}
function proposedSets(o){let m=new Map();for(const g of groups(o))for(const r of g.items){let label=summarySetName(r.program);m.set(norm(label),label)}return m}
function hasCurrentSet(o,key){return (CURRENT[o.c]||[]).some(x=>norm(summarySetName(x))===norm(summarySetName(key)))}
function hasProposedSet(o,key){return proposedSets(o).has(key)}
let selectedSummaryNpp='',selectedSummarySet='';
function summaryTableHTML(type,rows){
  let title=type==='npp'?'NPP':'TÊN SET';
  return `<div class="mini-table"><div class="mini-head"><div>${title}</div><div class="mh-cur">CH ĐANG TB</div><div class="mh-prop">CH ĐỀ NGHỊ</div></div>${rows.map(r=>`<div class="mini-row ${r.active?'active':''}" data-kind="${type}" data-key="${esc(r.key)}" role="button" tabindex="0"><div class="mini-name">${esc(r.name)}</div><div class="mini-current">${fmt(r.current)} CH</div><div class="mini-proposed">${fmt(r.proposed)} CH</div></div>`).join('')}</div>`
}
function renderSummary(){
  let all=DATA;
  let npps=[...new Set(all.map(o=>o.s))].sort((a,b)=>a.localeCompare(b,'vi'));
  let setMap=new Map();for(const xs of Object.values(CURRENT))for(const x of xs){let label=summarySetName(x);setMap.set(norm(label),label)}for(const o of all)for(const [k,v] of proposedSets(o))setMap.set(k,v);
  let nppRows=npps.map(npp=>{let base=all.filter(o=>o.s===npp);if(selectedSummarySet){let c=summaryCanonicalSet(selectedSummarySet);base=base.filter(o=>currentMatch(o,c)||proposedMatch(o,c))}return {key:npp,name:npp,current:base.filter(o=>selectedSummarySet?currentMatch(o,summaryCanonicalSet(selectedSummarySet)):(CURRENT[o.c]||[]).length>0).length,proposed:base.filter(o=>selectedSummarySet?proposedMatch(o,summaryCanonicalSet(selectedSummarySet)):proposedSets(o).size>0).length,active:npp===selectedSummaryNpp}});
  function summaryCanonicalSet(name){let n=norm(summarySetName(name));if(/^SACHET (1|2|3)$/.test(n)||n==='SACHET 1-3')return {key:'SACHET 1-3',name:'Sachet 1-3',group:1};if(/^(HC SET|BPC SET|FOOD SET)/.test(n)||n==='SUPER FG'||n==='DRUG L'||n==='H B L')return {key:n,name:summarySetName(name),group:0};if(/^SACHET/.test(n))return {key:n,name:summarySetName(name),group:1};if(/KNORR/.test(n))return {key:n,name:summarySetName(name),group:2};if(/FCL|HC/.test(n)&&!/^HC SET/.test(n))return {key:n,name:summarySetName(name),group:3};if(/KDR|ORAL|TBRUSH|PC/.test(n)&&!/^BPC SET/.test(n))return {key:n,name:summarySetName(name),group:4};if(/HAIR|MEN|HERBAL|SKIN|BOPHUSKIN/.test(n))return {key:n,name:summarySetName(name),group:5};return {key:n,name:summarySetName(name),group:9}}
  let grouped=new Map();for(const [rawKey,rawName] of setMap){let c=summaryCanonicalSet(rawName);if(!grouped.has(c.key))grouped.set(c.key,c)}
  function currentMatch(o,c){if(c.key==='SACHET 1-3')return (CURRENT[o.c]||[]).some(x=>/^SACHET (1|2|3)$/.test(norm(displayCurrent(x)))||norm(displayCurrent(x))==='SACHET 1-3');return hasCurrentSet(o,c.key)}
  function proposedMatch(o,c){if(c.key==='SACHET 1-3')return [...proposedSets(o).keys()].some(k=>/^SACHET (1|2|3)$/.test(k)||k==='SACHET 1-3');return hasProposedSet(o,c.key)}
  let summaryOrder=['SUPER FG','HC SET 1','HC SET 2','HC SET 3','HC SET 4','HC SET 5','HC BUILDING 1','HC BUILDING 2','HC BUILDING','DRUG L','DRUGL','BPC SET 1','BPC SET 2','BPC SET 3','BPC SET 4','BPC SET 5','BPC SET 6','BPC BUILDING','FOOD SET 1','FOOD SET 2','FOOD BUILDING','SACHET 1-3','SACHET 4','SACHET 5','SACHET 6','SACHET 7','SKIN 1','SKIN 2','HAIR 10M','MEN 10M','HERBAL 10M','HAIR 28M','50M','84M','T BRUSH 3V','TBRUSH 48-50M','35M ORAL','35M PREMIUM','ORAL 144M','PC 41M','PC ISLAND','8M FCL','HC 100M'];function summaryOrderIndex(x){let i=summaryOrder.indexOf(norm(summarySetName(x.name)));return i<0?999:i}let setRows=[...grouped.values()].sort((a,b)=>{let ai=summaryOrderIndex(a),bi=summaryOrderIndex(b);if(ai!==bi)return ai-bi;return a.name.localeCompare(b.name,'vi',{numeric:true})}).map(c=>{let base=selectedSummaryNpp?all.filter(o=>o.s===selectedSummaryNpp):all;return {key:c.key,name:c.name,current:base.filter(o=>currentMatch(o,c)).length,proposed:base.filter(o=>proposedMatch(o,c)).length,active:c.key===selectedSummarySet}});
  $('nppSummaryTable').innerHTML=summaryTableHTML('npp',nppRows);
  $('setSummaryTable').innerHTML=summaryTableHTML('set',setRows);
  document.querySelectorAll('.mini-row').forEach(row=>{let fire=()=>{if(row.dataset.kind==='npp')selectedSummaryNpp=selectedSummaryNpp===row.dataset.key?'':row.dataset.key;else selectedSummarySet=selectedSummarySet===row.dataset.key?'':row.dataset.key;renderSummary()};row.addEventListener('click',fire);row.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fire()}})});
}
function switchSheet(name){
  let summary=name==='summary';
  $('detailSheet').hidden=summary;$('summarySheet').hidden=!summary;
  document.querySelectorAll('.sheet-tab').forEach(b=>b.classList.toggle('active',b.dataset.sheet===name));
  if(summary)renderSummary();
}
function fillSetFilters(){let cur=[...new Set(Object.values(CURRENT).flat().map(displayCurrent).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'vi'));$('currentSet').innerHTML='<option value="">Tất cả set đang trưng bày</option>'+cur.map(v=>`<option value="${esc(norm(v))}">${esc(String(v).replaceAll('_',' '))}</option>`).join('');let pm=new Map();for(const o of DATA)for(const g of groups(o))for(const r of g.items)pm.set(norm(r.program),r.program.replaceAll('_',' '));$('proposedSet').innerHTML='<option value="">Tất cả set đề nghị</option>'+[...pm.entries()].sort((a,b)=>a[1].localeCompare(b[1],'vi')).map(([k,v])=>`<option value="${esc(k)}">${esc(v)}</option>`).join('')}
$('site').innerHTML += [...new Set(DATA.map(o=>o.s))].sort().map(v=>`<option>${esc(v)}</option>`).join('');$('salesPeriodText').textContent=SALES_PERIOD;fillSetFilters();$('q').addEventListener('input',render);$('site').addEventListener('change',render);$('currentSet').addEventListener('change',render);$('proposedSet').addEventListener('change',render);$('clearNpp').addEventListener('click',()=>{selectedSummaryNpp='';renderSummary()});$('clearSet').addEventListener('click',()=>{selectedSummarySet='';renderSummary()});document.querySelectorAll('.sheet-tab').forEach(b=>b.addEventListener('click',()=>switchSheet(b.dataset.sheet)));render();renderSummary();
</script></body></html>
